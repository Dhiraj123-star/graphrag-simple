services:
  graphrag-api:
    build: .
    container_name: graphrag-api

    expose:
      - "8000"
    env_file:
      - .env
    
    volumes:
      - ./graph.json:/app/graph.json
      - ./graph.html:/app/graph.html
    
    restart: unless-stopped

  nginx: 
    image: nginx:alpine
    container_name: graphrag-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    
    depends_on:
      - graphrag-api
    
    restart: unless-stopped